<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1584px; height: 396px; overflow: hidden; font-family: "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  .banner {
    position: relative; width: 1584px; height: 396px;
    background: linear-gradient(115deg, #0b1526 0%, #0f2240 55%, #123a5e 100%);
    color: #ffffff; overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .glow {
    position: absolute; width: 900px; height: 900px; right: -260px; top: -420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.22) 0%, rgba(56,189,248,0) 62%);
  }
  .glow2 {
    position: absolute; width: 600px; height: 600px; left: 420px; bottom: -420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, rgba(99,102,241,0) 65%);
  }
  .accent { position: absolute; left: 0; top: 0; width: 100%; height: 6px; background: linear-gradient(90deg, #38bdf8, #6366f1); }
  .content { position: absolute; left: 480px; top: 64px; right: 90px; }
  .eyebrow { font-size: 22px; letter-spacing: 6px; text-transform: uppercase; color: #7dd3fc; font-weight: 600; margin-bottom: 10px; }
  .title { font-size: 56px; font-weight: 700; line-height: 1.08; letter-spacing: -0.5px; margin: 0; }
  .sub { font-size: 26px; font-weight: 400; color: #cbd5e1; margin-top: 12px; }
  .stack { position: absolute; left: 480px; bottom: 34px; display: flex; gap: 14px; }
  .chip { font-size: 20px; padding: 8px 18px; border: 1px solid rgba(125,211,252,0.45); border-radius: 999px; color: #e0f2fe; background: rgba(255,255,255,0.04); }
  .bracket { position: absolute; right: 90px; bottom: 30px; font-family: Consolas, "Courier New", monospace; font-size: 26px; color: rgba(148,163,184,0.55); }
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="accent"></div>
  <div class="content">
    <div class="eyebrow">Product Engineer</div>
    <h1 class="title">Full-Stack SaaS &amp; B2B<br>Business Applications</h1>
    <div class="sub">From scoping and architecture to production, end to end.</div>
  </div>
  <div class="stack">
    <span class="chip">React</span>
    <span class="chip">Next.js</span>
    <span class="chip">Node.js</span>
    <span class="chip">PostgreSQL</span>
    <span class="chip">Supabase</span>
  </div>
  <div class="bracket">&lt;/&gt;</div>
</div>
</body>
</html>
